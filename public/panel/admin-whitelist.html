<!-- public/panel/admin-whitelist.html -->
<!-- Admin-Whitelist Management Panel -->

<div class="card">
  <div class="card-header">
    <h3>👮 Admin-Whitelist</h3>
    <p class="subtitle">Vertrauenswürdige Admins verwalten</p>
  </div>

  <div class="card-content">
    <!-- Add Admin Form -->
    <div class="form-section">
      <h4>Admin hinzufügen</h4>
      <form id="addAdminForm" class="form-inline">
        <input
          type="text"
          id="adminPhoneInput"
          placeholder="Telefonnummer (z.B. 49170123456)"
          class="form-input"
          required
        />
        <input
          type="text"
          id="adminReasonInput"
          placeholder="Grund (optional)"
          class="form-input"
        />
        <button type="submit" class="btn btn-primary">Hinzufügen</button>
      </form>
      <div id="addAdminStatus" class="status-message hidden"></div>
    </div>

    <!-- Whitelist Table -->
    <div class="table-section">
      <h4>Aktuelle Whitelist</h4>
      <div id="whitelistContainer" class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Telefonnummer</th>
              <th>Hinzugefügt von</th>
              <th>Datum</th>
              <th>Grund</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="whitelistTable">
            <tr class="loading">
              <td colspan="5">Lädt...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<style>
  .form-inline {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .form-input {
    flex: 1;
    min-width: 200px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
  }

  .form-input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th,
  .table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }

  .table th {
    background-color: #f5f5f5;
    font-weight: 600;
  }

  .table tbody tr:hover {
    background-color: #f9f9f9;
  }

  .btn-small {
    padding: 6px 12px;
    font-size: 12px;
    margin-right: 5px;
  }

  .btn-danger {
    background-color: #dc3545;
    color: white;
  }

  .btn-danger:hover {
    background-color: #c82333;
  }

  .status-message {
    padding: 10px;
    margin-top: 10px;
    border-radius: 4px;
    display: none;
  }

  .status-message.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }

  .status-message.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  .status-message.hidden {
    display: none;
  }
</style>

<script>
  // Admin-Whitelist Management
  async function loadWhitelist() {
    try {
      const res = await fetch('/api/admin/whitelist');
      if (!res.ok) throw new Error('Failed to load whitelist');
      const data = await res.json();

      const tbody = document.getElementById('whitelistTable');
      tbody.innerHTML = '';

      if (!data.whitelist || data.whitelist.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">Keine Einträge</td></tr>';
        return;
      }

      data.whitelist.forEach((entry) => {
        const date = new Date(entry.added_at).toLocaleString('de-DE');
        const phone = entry.user_jid.split('@')[0];

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${phone}</td>
          <td>${entry.added_by.split('@')[0]}</td>
          <td>${date}</td>
          <td>${entry.reason || '-'}</td>
          <td>
            <button class="btn btn-small btn-danger" onclick="removeFromWhitelist('${entry.user_jid}')">Entfernen</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    } catch (err) {
      console.error('Error loading whitelist:', err);
      const tbody = document.getElementById('whitelistTable');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center error">Fehler beim Laden</td></tr>';
    }
  }

  async function removeFromWhitelist(userJid) {
    if (!confirm('Wirklich entfernen?')) return;

    try {
      const res = await fetch('/api/admin/whitelist/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userJid }),
      });

      if (!res.ok) throw new Error('Failed to remove');
      showStatus('success', '✅ Entfernt');
      loadWhitelist();
    } catch (err) {
      showStatus('error', `❌ ${err.message}`);
    }
  }

  function showStatus(type, message) {
    const el = document.getElementById('addAdminStatus');
    el.textContent = message;
    el.className = `status-message ${type}`;
    setTimeout(() => {
      el.className = 'status-message hidden';
    }, 3000);
  }

  document.getElementById('addAdminForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const phone = document.getElementById('adminPhoneInput').value;
    const reason = document.getElementById('adminReasonInput').value;

    if (!phone) {
      showStatus('error', '❌ Telefonnummer erforderlich');
      return;
    }

    const userJid = `${phone.replace(/\D/g, '')}@s.whatsapp.net`;

    try {
      const res = await fetch('/api/admin/whitelist/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userJid, reason }),
      });

      if (!res.ok) throw new Error('Failed to add');

      showStatus('success', '✅ Admin hinzugefügt');
      document.getElementById('addAdminForm').reset();
      loadWhitelist();
    } catch (err) {
      showStatus('error', `❌ ${err.message}`);
    }
  });

  // Load on page load
  loadWhitelist();
  setInterval(loadWhitelist, 10000); // Refresh every 10s
</script>
